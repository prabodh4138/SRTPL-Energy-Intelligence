services:
  - type: web
    name: srtpl-energy-analytics
    env: python
    buildCommand: pip install -r deployment/requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ENERGY_STORAGE_BUCKET
        value: energy-original-files
      - key: APP_ENV
        value: production
